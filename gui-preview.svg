<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
  <defs>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#263238}.title{font-size:20px;font-weight:700}.section-title{font-size:18px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#596b75}.field{fill:#fff;stroke:#adbcc5;stroke-width:1.3;rx:5}.disabled{fill:#e5e9eb;stroke:#b7c0c5;stroke-width:1.3;rx:5}.section{fill:#f7f9fa;stroke:#cbd6dc;stroke-width:1.2;rx:9}.button{fill:#eff2f4;stroke:#aeb9bf;stroke-width:1.2;rx:4}.light{fill:#fff}
    </style>
    <g id="camera-controls">
      <rect width="41" height="34" class="button"/><path d="M11 12V8H16 M25 8H30V12 M11 22V26H16 M25 26H30V22" fill="none" stroke="#e24242" stroke-width="2.3"/><circle cx="20.5" cy="17" r="4.7" fill="none" stroke="#1680d1" stroke-width="2"/>
      <rect x="47" width="41" height="34" class="button"/><path d="M58 12V8H63 M72 8H77V12 M58 22V26H63 M72 26H77V22" fill="none" stroke="#1680d1" stroke-width="2.3"/><circle cx="67.5" cy="17" r="4.5" fill="none" stroke="#1680d1" stroke-width="2"/>
    </g>
    <g id="mark-actions">
      <rect width="86" height="34" class="button"/><text x="12" y="22" class="small">Save new</text>
      <rect x="92" width="76" height="34" class="button"/><text x="105" y="22" class="small">Update</text>
      <rect x="174" width="75" height="34" class="button"/><text x="189" y="22" class="small">Delete</text>
    </g>
  </defs>
  <rect width="1600" height="1010" fill="#e9eef1"/><rect width="1600" height="49" fill="#34454f"/>
  <text x="24" y="32" class="light" font-size="17" font-weight="700">OpenPnP 2.7 — Feeders</text>
  <rect y="49" width="213" height="961" fill="#f4f7f8" stroke="#cbd6dc"/>
  <text x="20" y="85" class="section-title">Feeders</text><rect x="12" y="105" width="189" height="39" rx="5" fill="#dcebf3"/>
  <text x="22" y="130" class="label">F01  Fiducial Auto Feeder</text><text x="22" y="177" class="label">F02  Fiducial Auto Feeder</text><text x="22" y="211" class="label">F03  ReferenceAutoFeeder</text>
  <rect x="228" y="65" width="1350" height="925" rx="10" fill="#fff" stroke="#cbd5da"/>
  <text x="248" y="99" class="title">F01 — ReferenceFiducialAutoFeeder</text>
  <text x="248" y="122" class="small">Multiple feeders on the same installation surface share its three saved fiducial references.</text>

  <rect x="245" y="141" width="148" height="39" rx="5" fill="#e6eef2" stroke="#aab9c2"/>
  <text x="261" y="167" class="label">Configuration</text>
  <rect x="399" y="141" width="129" height="39" rx="5" fill="#fff" stroke="#7b9fb5" stroke-width="2"/>
  <text x="417" y="167" class="label">Calibration</text>
  <g transform="translate(0,55)">

  <rect x="245" y="141" width="1315" height="88" class="section"/><text x="265" y="170" class="section-title">Installation surface</text>
  <text x="266" y="203" class="label">Surface</text><rect x="409" y="178" width="266" height="35" class="field"/><text x="422" y="201" class="label">Front deck</text><path d="M652 193h11l-6 7z" fill="#49616f"/>
  <rect x="702" y="178" width="122" height="35" class="button"/><text x="714" y="201" class="small">New surface</text>
  <rect x="834" y="178" width="93" height="35" class="button"/><text x="854" y="201" class="small">Rename</text>
  <rect x="937" y="178" width="123" height="35" class="button"/><text x="950" y="201" class="small">Delete surface</text>
  <text x="1090" y="201" class="small">F02 can select this surface or another one.</text>

  <rect x="245" y="246" width="1315" height="275" class="section"/><text x="265" y="278" class="section-title">Shared machine fiducials</text>
  <text x="266" y="312" class="small">Mark</text><text x="416" y="312" class="small">Saved fiducial</text><text x="670" y="312" class="small">X</text><text x="783" y="312" class="small">Y</text><text x="892" y="312" class="small">Camera controls</text><text x="1000" y="312" class="small">Manage selected fiducial</text><text x="1285" y="312" class="small">Machine origin</text>
  <text x="266" y="353" class="label">fid_A  Front left</text><rect x="409" y="327" width="242" height="36" class="field"/><text x="422" y="351" class="label">Fid_-250.000_-200.000</text><path d="M630 342h11l-6 7z" fill="#49616f"/>
  <rect x="663" y="327" width="103" height="36" class="field"/><text x="672" y="350" class="label">-250.000</text><rect x="776" y="327" width="103" height="36" class="field"/><text x="785" y="350" class="label">-200.000</text><use href="#camera-controls" x="890" y="328"/><use href="#mark-actions" x="998" y="328"/>
  <text x="266" y="407" class="label">fid_B  Front right</text><rect x="409" y="381" width="242" height="36" class="field"/><text x="422" y="405" class="label">Fid_0.000_-200.000</text><path d="M630 396h11l-6 7z" fill="#49616f"/>
  <rect x="663" y="381" width="103" height="36" class="field"/><text x="672" y="404" class="label">0.000</text><rect x="776" y="381" width="103" height="36" class="field"/><text x="785" y="404" class="label">-200.000</text><use href="#camera-controls" x="890" y="382"/><use href="#mark-actions" x="998" y="382"/>
  <text x="266" y="461" class="label">fid_C  Rear right</text><rect x="409" y="435" width="242" height="36" class="disabled"/><text x="422" y="459" class="small">Fid_0.000_0.000</text>
  <rect x="663" y="435" width="103" height="36" class="disabled"/><text x="672" y="458" class="small">0.000</text><rect x="776" y="435" width="103" height="36" class="disabled"/><text x="785" y="458" class="small">0.000</text><use href="#camera-controls" x="890" y="436" opacity="0.38"/><use href="#mark-actions" x="998" y="436" opacity="0.38"/>
  <rect x="1284" y="444" width="18" height="18" fill="#fff" stroke="#93a6b2"/><path d="M1287 453l5 5 8-11" fill="none" stroke="#2378b9" stroke-width="2.6"/><text x="1312" y="460" class="label">Use machine origin</text>
  <text x="266" y="500" class="small">Capture with the camera, then Save new or Update. A changed name keeps the same internal reference.</text>

  <rect x="245" y="539" width="642" height="351" class="section"/><text x="265" y="571" class="section-title">Three-point calibration</text>
  <text x="266" y="612" class="label">Fiducial Part</text><rect x="508" y="588" width="345" height="35" class="field"/><text x="520" y="611" class="label">FIDUCIAL-HOME</text><path d="M830 603h11l-6 7z" fill="#49616f"/>
  <text x="266" y="663" class="label">Maximum mark shift</text><rect x="508" y="639" width="118" height="35" class="field"/><text x="520" y="662" class="label">3.0 mm</text>
  <text x="266" y="713" class="label">Maximum scale / shear</text><rect x="508" y="689" width="118" height="35" class="field"/><text x="520" y="712" class="label">1.0 %</text>
  <rect x="267" y="746" width="18" height="18" fill="#fff" stroke="#93a6b2"/><text x="296" y="761" class="label">Enable periodic calibration</text>
  <text x="266" y="810" class="label">Interval</text><rect x="508" y="785" width="118" height="35" class="field"/><text x="520" y="808" class="label">5 min</text>
  <rect x="666" y="785" width="142" height="39" rx="5" fill="#2677a4"/><text x="686" y="811" class="label light">Calibrate now</text><text x="266" y="859" class="small">Shared references; calibration runs for each feeder.</text>

  <rect x="905" y="539" width="655" height="351" class="section"/><text x="925" y="571" class="section-title">Top-camera part recognition</text>
  <rect x="926" y="597" width="18" height="18" fill="#fff" stroke="#93a6b2"/><path d="M929 605l5 6 8-11" fill="none" stroke="#2378b9" stroke-width="2.6"/><text x="956" y="612" class="label">Recognize the fed part</text>
  <text x="925" y="665" class="label">Recognition mode</text><rect x="1164" y="640" width="357" height="36" class="field"/><text x="1177" y="664" class="label">First feed in job</text><path d="M1498 655h11l-6 7z" fill="#49616f"/>
  <text x="925" y="715" class="label">Maximum part shift</text><rect x="1164" y="690" width="121" height="35" class="field"/><text x="1177" y="713" class="label">1.0 mm</text>
  <rect x="925" y="748" width="159" height="39" rx="5" fill="#fff" stroke="#84a0b0"/><text x="945" y="774" class="label">Locate part now</text>
  <rect x="1100" y="748" width="173" height="39" rx="5" fill="#fff" stroke="#84a0b0"/><text x="1118" y="774" class="label">Edit part pipeline</text>
  <rect x="1289" y="748" width="170" height="39" rx="5" fill="#fff" stroke="#84a0b0"/><text x="1307" y="774" class="label">Reset part pipeline</text>
  <text x="925" y="823" class="small">Modes: Every feed · First feed in job · Manual only</text><text x="925" y="850" class="small">The detected XY refines the corrected nominal pick location.</text>
  </g>
</svg>
