<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #263238; }
      .title { font-size: 20px; font-weight: 700; } .section-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; } .small { font-size: 13px; fill: #596b75; }
      .field { fill: #fff; stroke: #adbcc5; stroke-width: 1.3; rx: 5; }
      .section { fill: #f7f9fa; stroke: #cbd6dc; stroke-width: 1.2; rx: 9; }
      .button { fill: #eff2f4; stroke: #aeb9bf; stroke-width: 1.2; rx: 3; }
      .light { fill: #fff; }
    </style>
    <g id="location-controls">
